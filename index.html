<script>
        // ຂໍ້ມູນພະນັກງານສາທາລະນະສຸກເບື້ອງຕົ້ນ (ຕົວຢ່າງຈາກໄຟລ໌)
        const defaultHealthWorkers = [
            { province: "Phongsaly", district: "Samphanh", facility: "HC Namhang", hwId: "101002", name: "ນາງຈັນມະນີ ວື", gender: "Female" },
            { province: "Phongsaly", district: "Samphanh", facility: "HC Namhang", hwId: "101003", name: "ນາງ ພິມແກ້ວ ສິລິຄຳ", gender: "Female" },
            { province: "Phongsaly", district: "Samphanh", facility: "HC Laoleo", hwId: "102004", name: "ນາງ ຈັນສີ ຜົມມະສິງ", gender: "Female" },
            { province: "Phongsaly", district: "Samphanh", facility: "HC Sanamha", hwId: "104012", name: "ນາງ ໄສ ສົມະນີ", gender: "Female" },
            { province: "Salavan", district: "Salavan", facility: "HC Nadonkhouang", hwId: "411441", name: "ນາງ ຄຳສັກສິດ ຈັນທະກຸມມານ", gender: "Female" },
            { province: "Salavan", district: "Salavan", facility: "HC Napho", hwId: "411451", name: "ນາງ ຈັນສະໝອນ ໄກຍະກອນ", gender: "Female" },
            { province: "Salavan", district: "Toumlan", facility: "HC Tambeng", hwId: "411591", name: "ທ ໂສນ ແສນຄຳບົວທອນ", gender: "Male" }
        ];

        let healthWorkers = [];

        // ດຶງຂໍ້ມູນຈາກ LocalStorage ຖ້າມີ
        try {
            const savedData = localStorage.getItem('css_health_workers');
            if (savedData) {
                healthWorkers = JSON.parse(savedData);
            } else {
                healthWorkers = [...defaultHealthWorkers];
                localStorage.setItem('css_health_workers', JSON.stringify(healthWorkers));
            }
        } catch (e) {
            healthWorkers = [...defaultHealthWorkers];
        }

        function copyHWID(text, btnElement) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                const icon = btnElement.querySelector('i');
                icon.className = "fa-solid fa-check text-green-500";
                setTimeout(() => {
                    icon.className = "fa-regular fa-copy";
                }, 1500);
            } catch (err) {
                alert('ບໍ່ສາມາດກັອບປີ້ໄດ້');
            }
            document.body.removeChild(textArea);
        }

        function renderTable(data) {
            const tbody = document.getElementById('hw-table-body');
            if (!tbody) return; 
            
            tbody.innerHTML = ''; 
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">ບໍ່ພົບຂໍ້ມູນທີ່ທ່ານຄົ້ນຫາ</td></tr>';
                return;
            }
            
            data.forEach(hw => {
                const tr = document.createElement('tr');
                tr.className = "bg-white border-b hover:bg-blue-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-4 py-3 font-medium text-gray-900 whitespace-nowrap">${hw.name || '-'}</td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-2">
                            <span class="font-mono bg-gray-100 px-2 py-1 rounded text-blue-700">${hw.hwId || '-'}</span>
                            <button onclick="copyHWID('${hw.hwId}', this)" class="text-gray-400 hover:text-blue-600 transition-colors p-1" title="ກັອບປີ້ລະຫັດ">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </td>
                    <td class="px-4 py-3">${(hw.gender && hw.gender.toLowerCase() === 'female') ? '<span class="px-2 py-1 bg-pink-100 text-pink-700 rounded-full text-xs">ຍິງ</span>' : '<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded-full text-xs">ຊາຍ</span>'}</td>
                    <td class="px-4 py-3">${hw.facility || '-'}</td>
                    <td class="px-4 py-3">${hw.district || '-'}</td>
                    <td class="px-4 py-3">${hw.province || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ຟັງຊັນຄົ້ນຫາແບບໃໝ່ (ຄົ້ນຫາໄດ້ທຸກຖັນ)
        function handleSearch(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            const filteredData = healthWorkers.filter(hw => {
                const sName = (hw.name || '').toLowerCase();
                const sId = (hw.hwId || '').toLowerCase();
                const sFacility = (hw.facility || '').toLowerCase();
                const sDistrict = (hw.district || '').toLowerCase();
                const sProvince = (hw.province || '').toLowerCase();
                
                return sName.includes(searchTerm) || 
                       sId.includes(searchTerm) ||
                       sFacility.includes(searchTerm) ||
                       sDistrict.includes(searchTerm) ||
                       sProvince.includes(searchTerm);
            });
            renderTable(filteredData);
        }

        // ຟັງຊັນອ່ານໄຟລ໌ CSV ທີ່ອັບໂຫຼດເຂົ້າລະບົບ
        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                const newWorkers = [];
                
                // ເລີ່ມແຖວທີ 1 (ຂ້າມ Header ໄປ)
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(',');
                    // ໂຄງສ້າງ: Pcode,Dcode,Province,District,Hcode,Facility,HW ID,Participant ID,Name,Gender
                    if (cols.length >= 10) {
                        newWorkers.push({
                            province: cols[2].trim(),
                            district: cols[3].trim(),
                            facility: cols[5].trim(),
                            hwId: cols[6].trim(),
                            name: cols[8].trim(),
                            gender: cols[9].trim().replace('\r', '')
                        });
                    }
                }
                
                if(newWorkers.length > 0) {
                    healthWorkers = newWorkers;
                    localStorage.setItem('css_health_workers', JSON.stringify(healthWorkers));
                    renderTable(healthWorkers);
                    alert(`ສຳເລັດ! ອັບເດດຂໍ້ມູນພະນັກງານຈຳນວນ ${newWorkers.length} ຄົນ ເຂົ້າສູ່ລະບົບແລ້ວ.`);
                }
            };
            reader.readAsText(file);
        }

        // --- ລະບົບເພີ່ມຂໍ້ມູນໃໝ່ (Modal) ---
        const modal = document.getElementById('addStaffModal');
        function openModal() { modal.classList.remove('hidden'); }
        function closeModal() { modal.classList.add('hidden'); document.getElementById('addStaffForm').reset(); }

        function handleAddStaff(e) {
            e.preventDefault();
            const newEntry = {
                name: document.getElementById('newName').value.trim(),
                hwId: document.getElementById('newId').value.trim(),
                gender: document.getElementById('newGender').value,
                facility: document.getElementById('newFacility').value.trim(),
                district: document.getElementById('newDistrict').value.trim(),
                province: document.getElementById('newProvince').value.trim()
            };

            healthWorkers.unshift(newEntry);
            try { localStorage.setItem('css_health_workers', JSON.stringify(healthWorkers)); } catch(e) {}
            
            renderTable(healthWorkers);
            closeModal();
            const searchInput = document.getElementById('searchInput');
            if(searchInput) searchInput.value = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', handleSearch);
                renderTable(healthWorkers); 
            }
        });
    </script>
